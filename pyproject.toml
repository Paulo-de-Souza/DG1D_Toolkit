[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dg1d-toolkit"
version = "0.1.0"
description = "One-dimensional discontinuous Galerkin research and teaching toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Paulo de Souza" }]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "scipy>=1.10",
    "sympy>=1.12",
    "Pillow>=10.0",
]

[tool.setuptools.packages.find]
include = ["dg1d_toolkit*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
